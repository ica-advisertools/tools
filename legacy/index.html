<title>PRUApex Legacy Index II Simulator</title>
<style>
:root{--ink:#14181D;--ink-2:#1C222A;--ink-3:#252C36;--gold:#A6813E;--gold-l:#C9A968;--paper:#E9E7E2;--dim:#9FA6AF;--line:rgba(233,231,226,.14);--line-2:rgba(233,231,226,.32);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.5 'Segoe UI',system-ui,-apple-system,sans-serif}
.lock{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbox{width:min(420px,100%);background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:28px 26px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);margin:0 0 8px}
.lockbox h1{font-size:24px;margin:0 0 6px;font-weight:700}
.lockbox p{color:var(--dim);font-size:13.5px;margin:0 0 18px}
.lockbox label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.lockbox #pw{width:100%;background:var(--ink-3);border:1px solid var(--line-2);color:var(--paper);font:500 15px inherit;padding:10px 12px;border-radius:8px}
.lockbox .rem{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--paper);font-size:13.5px}
.lockbox .rem input{accent-color:var(--gold);width:16px;height:16px}
.lockbox button{width:100%;background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--ink);border:0;border-radius:8px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
.lockbox .msg{color:#F0A27F;font-size:13px;min-height:18px;margin:10px 0 0}
.lockbox .fine{font-size:12px;margin:16px 0 0}
.pwwrap{position:relative}.pwwrap input[type=password],.pwwrap input[type=text]{width:100%;padding-right:44px!important}.pwwrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;background:none!important;border:0;border-radius:6px;color:var(--dim);cursor:pointer;padding:0!important}.pwwrap .eye:hover{color:var(--paper)}.eye svg{width:20px;height:20px}
</style></head><body>

</div>

(function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const P = JSON.parse(atob(PAYLOAD));
  const msg = document.getElementById('lockMsg');
  async function keyFromPw(pw){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  async function decrypt(key){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html){ const go = () => { document.open(); document.write(html); document.close(); }; if (document.readyState === 'complete') go(); else window.addEventListener('load', go, {once:true}); }
  document.getElementById('lockForm').addEventListener('submit', async e => {
    e.preventDefault(); msg.textContent = 'Checking…';
    let key, html;
    try { key = await keyFromPw(document.getElementById('pw').value); html = await decrypt(key); }
    catch(err) { msg.textContent = 'That password is not right. Please check with Laura.'; return; }
    try { const kv = toB64(await crypto.subtle.exportKey('raw', key)) + '.' + P.salt; sessionStorage.setItem('pvw3_key', kv); localStorage.setItem('pvw3_key', document.getElementById('remember').checked ? kv : kv + '.' + (Date.now() + 12*3600*1000)); } catch(e){}
    show(html);
  });
  (async () => {
    try {
      const saved = localStorage.getItem('pvw3_key') || sessionStorage.getItem('pvw3_key');
      if (!saved) return;
      const [k, salt, exp] = saved.split('.');
      if (salt !== P.salt || (exp && Date.now() > +exp)) { localStorage.removeItem('pvw3_key'); sessionStorage.removeItem('pvw3_key'); return; }
      const key = await crypto.subtle.importKey('raw', b64(k), {name:'AES-GCM'}, false, ['decrypt']);
      show(await decrypt(key));
    } catch(e) { /* keep the saved login: an out-of-date copy of a page must not log the person out of the others */ }
  })();
})();
