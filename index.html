<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>[hidden]{display:none!important}</style></head><body>
<title>PRUVantage Plan Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: letterhead, then a sticky inputs column beside a results column; stacks to one column on phones.
   Deliberately single dark theme, matching the Retirement Calculator family. */
:root{
  --ink:#14181D; --ink-2:#1C222A; --ink-3:#252C36;
  --gold:#A6813E; --gold-l:#C9A968; --paper:#E9E7E2; --dim:#9FA6AF;
  --sage:#8DB089; --rust:#D9764B; --blue:#7B9FC7;
  --line:rgba(233,231,226,.14); --line-2:rgba(233,231,226,.32);
  --f-display:'Manrope', 'Segoe UI', system-ui, sans-serif;
  --f-body:'DM Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-block:36px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-weight:700;font-size:clamp(24px,3.6vw,34px);letter-spacing:-.02em}
h2{font-weight:600;font-size:19px;letter-spacing:-.01em}
.h3{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--paper)}
.eyebrow{margin:0 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);font-weight:600}
.sub{margin:8px 0 0;color:var(--dim);max-width:60ch}
.letterhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line-2);margin-bottom:18px}
.meta{display:grid;gap:4px;font-size:12.5px;text-align:right}
.meta .k{color:var(--dim);margin-right:8px}
.meta .v{color:var(--paper);font-weight:600}
.banner{border:1px solid rgba(217,118,75,.55);background:rgba(217,118,75,.10);color:var(--paper);border-radius:8px;padding:12px 16px;font-size:13.5px;margin-bottom:24px;line-height:1.55}
.banner strong{color:#F0A27F}
.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
.grid>*{min-width:0}
@media(min-width:981px){.inputs{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin}}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.inputs,.results{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
.panel{min-width:0}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:20px}
.ptitle{font-family:var(--f-body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.ptitle::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.row label{font-size:14px;min-width:0}
.row>input,.row>select,.fx{flex:0 0 auto}
input[type=number],input[type=text],select{background:var(--ink-3);border:1px solid var(--line-2);color:var(--gold-l);font:600 14px var(--f-body);padding:7px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
input[type=text]{color:var(--paper);width:170px}
.row>input[type=number]{width:96px;text-align:right}
select{color:var(--paper);font-weight:500;max-width:200px;cursor:pointer}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.fx{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px}
.fx input{width:96px;text-align:right}
.note{color:var(--dim);font-size:13px;margin:4px 0 10px}
.note.small{font-size:12px;margin-top:10px}
.err{color:#F0A27F;font-size:13px;margin:8px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--ink-3);border:1px solid var(--line-2);border-radius:9px}
.seg button{flex:1 1 0;min-width:52px;background:transparent;border:0;color:var(--dim);font:600 14px var(--f-body);padding:8px 6px;border-radius:6px;cursor:pointer;line-height:1.2}
.seg button small{display:block;font-size:10.5px;font-weight:500;opacity:.8;margin-top:2px}
.seg button:hover{color:var(--paper);background:rgba(233,231,226,.06)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--ink)}
.seg.small{display:inline-flex;flex-wrap:wrap}
.seg.small button{flex:0 0 auto;font-size:12.5px;padding:6px 12px}
#termSeg{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--ink-3);border:1px solid var(--line);color:var(--dim)}
.chip.ok{color:var(--sage);border-color:rgba(141,176,137,.45)}
.chip.warn{color:#F0A27F;border-color:rgba(217,118,75,.55)}
.sched-head,.sched-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.sched-head{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.sched-row{margin-bottom:8px}
.sched-row>input{width:100%;text-align:right}
.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold-l);font:600 13px var(--f-body);padding:7px 14px;border-radius:8px;cursor:pointer}
.ghost:hover{background:rgba(166,129,62,.14)}
.ghost.wide{width:100%;padding:10px}
.solid{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--ink);border:0;font:700 13px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer}
.meta-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.meta{position:relative}
.pdf-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:min(340px,calc(100vw - 32px));text-align:left;background:var(--ink-3);border:1px solid rgba(201,169,104,.5);border-radius:10px;padding:14px 16px;box-shadow:0 18px 40px -20px rgba(0,0,0,.8);display:grid;gap:6px}
@media(max-width:640px){.pdf-panel{position:static;width:100%}}
.pdf-title{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);font-weight:600}
.pdf-note{margin:0 0 4px;font-size:12px;color:var(--dim)}
.pdf-panel label{font-size:12px;color:var(--dim)}
.pdf-panel input{width:100%;color:var(--paper)}
.pdf-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.pdf-msg{margin:0;font-size:12px;color:var(--dim);min-height:16px}
.prev-box{position:fixed;inset:0;z-index:200;background:rgba(10,12,15,.85);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.prev-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:860px;width:100%;margin:0 auto 8px}
.prev-bar p{margin:0;font-size:13px;color:var(--paper)} .prev-bar .btns{display:flex;gap:8px}
#prevFrame{flex:1;width:100%;max-width:860px;margin:0 auto;border:0;border-radius:6px;background:#fff}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.yearpick{font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
.yearpick input{width:70px;text-align:right}
.alert{margin:0 0 14px;border:1px solid rgba(217,118,75,.65);background:rgba(217,118,75,.14);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--paper)}
.alert strong{color:#F0A27F}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .k{margin:0 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.kpi .v{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.2vw,22px);color:var(--paper);overflow-wrap:anywhere}
.kpi.key{border-color:rgba(201,169,104,.55);background:linear-gradient(160deg,rgba(201,169,104,.16),rgba(201,169,104,0) 70%),var(--ink-3)}
.kpi.key .v{color:var(--gold-l)}
.kpi.neg .v{color:var(--rust)}
.tscroll{overflow-x:auto;margin:4px 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th{color:var(--dim);font-weight:500;text-align:right;padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:normal;min-width:84px;vertical-align:bottom;font-size:12px}
.tbl td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child,.tbl .l{text-align:left}
.tbl tbody th{color:var(--paper);font-weight:600;text-align:left;font-size:13px}
.tbl tr.hl td{background:rgba(166,129,62,.16);font-weight:600}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--line-2)}
.tbl td.pos{color:var(--sage)} .tbl td.neg{color:var(--rust)} .tbl td.zero{color:var(--dim);opacity:.6} .tbl td.warn{color:#F0A27F}
.tbl td.drv{color:var(--sage);font-weight:600}
.lapse-tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:10px;background:rgba(217,118,75,.18);color:#F0A27F;border:1px solid rgba(217,118,75,.5)}
.lapse-tag.dim{opacity:.6}
.tbl tr.lapsed td{color:var(--dim)}
.tbl th.cur{color:var(--gold-l)} .tbl td.cur{color:var(--gold-l);font-weight:600}
#cmpSeg{margin:10px 0 4px}
.picker{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.picker-label{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);font-weight:600}
.pseg{display:flex;flex-wrap:wrap;gap:6px;padding:5px;background:var(--ink-2);border:1px solid var(--line-2);border-radius:12px;flex:1 1 420px;max-width:900px}
.pseg button{flex:1 1 180px;background:transparent;border:0;color:var(--dim);font:700 15px var(--f-display);padding:10px 14px;border-radius:8px;cursor:pointer;text-align:left}
.pseg button small{display:block;font:500 12px var(--f-body);opacity:.85;margin-top:2px}
.pseg button:hover{color:var(--paper);background:rgba(233,231,226,.06)}
.pseg button[aria-pressed=true]{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.sw1{background:var(--gold)} .sw2{background:var(--blue)}
.sw3{background:var(--rust)}
.ln{display:inline-block;width:18px;height:0;border-top:2px solid var(--sage)}
.ln-db{border-top-color:var(--sage)} .ln-paid{border-top:2px dashed var(--paper);opacity:.7} .ln-cum{border-top-color:var(--paper)}
.chart .dbline{fill:none;stroke:var(--sage);stroke-width:2}
.chart .cumline{fill:none;stroke:var(--paper);stroke-width:1.5;opacity:.8}
.chart .b3{fill:var(--rust)} .chart .bar.hov .b3{fill:#F0A27F}
.chart .ax.r{fill:var(--paper);opacity:.75}
.chart-empty{padding:28px 16px;text-align:center;color:var(--dim);border:1px dashed var(--line-2);border-radius:8px;font-size:13.5px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--dim);font:12px var(--f-body)}
.chart .hit{fill:transparent}
.chart .b1{fill:var(--gold)} .chart .b2{fill:var(--blue)}
.chart .bar.hov .b1{fill:var(--gold-l)} .chart .bar.hov .b2{fill:#9DBBDD}
.chart .paidline{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
.readout{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--dim);margin-top:10px;min-height:20px}
.readout b{color:var(--paper);font-weight:600}
.readout .dim{opacity:.8}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:14px 0 0}
@media(max-width:700px){.feats{grid-template-columns:1fr}}
.feats div{border-bottom:1px solid var(--line);padding-bottom:8px;min-width:0}
.feats dt{font-size:12px;color:var(--dim);margin-bottom:2px}
.feats dd{margin:0;font-size:14px}
.disc{margin-top:36px;padding-top:20px;border-top:1px solid var(--line-2);color:var(--dim);font-size:13px;max-width:900px}
.disc h2{font-size:16px;color:var(--paper);margin-bottom:8px}
.disc ul{margin:0;padding-left:18px;display:grid;gap:6px}
/* lock screen */
.lock{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbox{width:min(420px,100%);background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:28px 26px}
.lockbox h1{font-size:24px;margin-bottom:6px}
.lockbox p{color:var(--dim);font-size:13.5px;margin:0 0 18px}
.lockbox label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.lockbox input[type=password]{width:100%;background:var(--ink-3);border:1px solid var(--line-2);color:var(--paper);font:500 15px var(--f-body);padding:10px 12px;border-radius:8px}
.lockbox .rem{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--paper);font-size:13.5px}
.lockbox .rem input{accent-color:var(--gold);width:16px;height:16px}
.lockbox button{width:100%;background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--ink);border:0;border-radius:8px;padding:11px;font:700 14px var(--f-body);cursor:pointer}
.lockbox .msg{color:#F0A27F;font-size:13px;min-height:18px;margin:10px 0 0}
.lockbox .fine{font-size:12px;margin:16px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="lock" id="lock">
  <form class="lockbox" id="lockForm" autocomplete="off">
    <p class="eyebrow">Advisers only</p>
    <h1>PRUVantage Plan Simulator</h1>
    <p>Enter the team password to open the simulator.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="rem" for="remember"><input id="remember" type="checkbox"> Remember on this device</label>
    <button type="submit" id="unlockBtn">Unlock</button>
    <p class="msg" id="lockMsg" aria-live="polite"></p>
    <p class="fine">Internal use only. Not a Prudential benefit illustration.</p>
  </form>
</div>
<div id="app" hidden></div>

(function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const P = JSON.parse(atob(PAYLOAD)); // {salt, iv, ct, iter}
  const msg = document.getElementById('lockMsg');
  async function keyFromPw(pw){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  async function open(key){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    const app = JSON.parse(new TextDecoder().decode(pt));
    const host = document.getElementById('app');
    host.innerHTML = app.html;
    document.getElementById('lock').hidden = true;
    host.hidden = false;
    const s = document.createElement('script'); s.textContent = app.js; document.body.appendChild(s);
    if (!window.__pvwBooted) { try { (new Function(app.js))(); } catch(e) { console.error(e); } }
    if (!window.__pvwBooted) { host.hidden = true; document.getElementById('lock').hidden = false; msg.textContent = 'The simulator could not start in this browser. Please try another browser.'; }
  }
  document.getElementById('lockForm').addEventListener('submit', async e => {
    e.preventDefault(); msg.textContent = 'Checking…';
    try {
      const key = await keyFromPw(document.getElementById('pw').value);
      await open(key);
      if (document.getElementById('remember').checked) { try { localStorage.setItem('pvw3_key', toB64(await crypto.subtle.exportKey('raw', key)) + '.' + P.salt); } catch(e){} }
      msg.textContent = '';
    } catch(err) { msg.textContent = 'That password is not right. Please check with Laura.'; }
  });
  (async () => {
    try {
      const saved = localStorage.getItem('pvw3_key');
      if (saved) {
        const [k, salt] = saved.split('.');
        if (salt !== P.salt) { localStorage.removeItem('pvw3_key'); return; }
        const key = await crypto.subtle.importKey('raw', b64(k), {name:'AES-GCM'}, false, ['decrypt']);
        await open(key);
      }
    } catch(e) { try { localStorage.removeItem('pvw3_key'); } catch(_){} }
  })();
})();
