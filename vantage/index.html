  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  let P = JSON.parse(atob(PAYLOAD)); // {salt, iv, ct, iter}
  // Always open the newest published copy, even if this browser saved an older one.
  const fresh = (async () => { try { const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 4000); const r = await fetch(location.pathname + '?fresh=' + Date.now(), {cache:'no-store', signal: ctl.signal}); clearTimeout(tm); const m = (await r.text()).match(/const PAYLOAD = "([A-Za-z0-9+\/=]{100,})"/); if (m && m[1] !== PAYLOAD) P = JSON.parse(atob(m[1])); } catch(e) {} })();
  const msg = document.getElementById('lockMsg');
  async function keyFromPw(pw){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);

  async function open(key){

    const host = document.getElementById('app');

    document.getElementById('lock').hidden = true;
    host.hidden = false;
    const s = document.createElement('script'); s.textContent = app.js; document.body.appendChild(s);
